name: CI — Quality Gate (ISO/IEEE)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies and QA tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio ruff mypy

      - name: Lint and security check (Ruff + Bandit rules)
        run: ruff check src tests

      - name: Strict static type checking (Mypy)
        run: mypy src tests

      - name: Unit & Integration test suite (Pytest)
        run: pytest
