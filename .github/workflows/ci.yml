name: CI — HUDMind Native (.NET 9 Quality Gate)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-dotnet9-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build & Run .NET 9 Core Test Suite
        run: |
          dotnet build native/HUDMind.Tests/HUDMind.Tests.csproj -c Release
          dotnet run --project native/HUDMind.Tests/HUDMind.Tests.csproj -c Release --no-build

  native-windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build Full Windows Solution & Run Tests
        run: |
          dotnet build native/HUDMind.sln -c Release
          dotnet run --project native/HUDMind.Tests/HUDMind.Tests.csproj -c Release --no-build
