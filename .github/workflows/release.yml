name: Release — HUDMind Native (Windows x64)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release semver (ej: v1.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Marcar como pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Resolve and validate release tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $tag = $tag.Trim()
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag '$tag'. Expected format vMAJOR.MINOR.PATCH (e.g. v1.1.0)."
          }
          $ver = $tag.Substring(1)
          $isPre = (("${{ inputs.prerelease }}" -eq "true") -or $tag.Contains('-')).ToString().ToLowerInvariant()
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IS_PRERELEASE=$isPre" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Preparing release $tag (Assembly version $ver, prerelease=$isPre)"

      - name: Run full test & WPF smoke quality gate
        shell: pwsh
        run: |
          dotnet build native/HUDMind.sln -c Release -p:Version=$env:APP_VERSION
          dotnet run --project native/HUDMind.Tests/HUDMind.Tests.csproj -c Release --no-build
          dotnet run --project native/HUDMind.Windows.Tests/HUDMind.Windows.Tests.csproj -c Release --no-build
          $p = Start-Process -FilePath "native/HUDMind.App/bin/Release/net9.0-windows10.0.19041.0/HUDMind.Native.exe" -ArgumentList "--smoke-startup" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WPF --smoke-startup failed with exit code $($p.ExitCode)" }

      - name: Install build-time IL hardening CLI (zero runtime NuGet dependencies)
        shell: pwsh
        run: dotnet tool install -g Obfuscar.GlobalTool --version 2.2.50

      - name: Publish Hardened Standalone & Framework-Dependent Single-File .exe
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null

          dotnet publish native/HUDMind.App/HUDMind.App.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true -p:EnableCompressionInSingleFile=true -p:ObfuscateRelease=true `
            -p:DebugType=None -p:DebugSymbols=false -p:DebuggerSupport=false `
            -p:Version=$env:APP_VERSION -o release-out/standalone

          $p1 = Start-Process -FilePath "release-out/standalone/HUDMind.Native.exe" -ArgumentList "--smoke-startup" -Wait -PassThru
          if ($p1.ExitCode -ne 0) { throw "Standalone exe --smoke-startup failed ($($p1.ExitCode))" }
          Copy-Item "release-out/standalone/HUDMind.Native.exe" "release-assets/HUDMind.Native-Standalone-win-x64.exe" -Force

          dotnet publish native/HUDMind.App/HUDMind.App.csproj -c Release -r win-x64 `
            --no-self-contained -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true -p:ObfuscateRelease=true `
            -p:DebugType=None -p:DebugSymbols=false -p:DebuggerSupport=false `
            -p:Version=$env:APP_VERSION -o release-out/compact

          $p2 = Start-Process -FilePath "release-out/compact/HUDMind.Native.exe" -ArgumentList "--smoke-startup" -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "Compact exe --smoke-startup failed ($($p2.ExitCode))" }
          Copy-Item "release-out/compact/HUDMind.Native.exe" "release-assets/HUDMind.Native-win-x64.exe" -Force

          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            $cmdIscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmdIscc) { $iscc = $cmdIscc.Source }
          }
          if (-not $iscc) { throw "Inno Setup 6 ISCC.exe not found." }
          $standaloneAbs = (Resolve-Path "release-out/standalone/HUDMind.Native.exe").Path
          $assetsAbs = (Resolve-Path "release-assets").Path
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "/DInputExe=$standaloneAbs" "/O$assetsAbs" "native/installer/HUDMind.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          if (-not [string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_BASE64) -and -not [string]::IsNullOrWhiteSpace($env:CODESIGN_PASSWORD)) {
            Write-Host "Signing release binaries with Authenticode certificate..."
            $pfxPath = Join-Path $env:RUNNER_TEMP "hudmind-codesign.pfx"
            [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
            try {
              $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
              if (-not $signtool) { throw "signtool.exe not found on runner" }
              foreach ($exe in Get-ChildItem "release-assets/*.exe") {
                & $signtool sign /f $pfxPath /p $env:CODESIGN_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $exe.FullName
                if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($exe.Name)" }
              }
            }
            finally {
              Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "Notice: CODESIGN_PFX_BASE64 secret not set; skipping Authenticode signing ($0 mode, SHA256SUMS.txt generated)."
          }

          $hashLines = @()
          foreach ($file in Get-ChildItem "release-assets/*.exe" | Sort-Object Name) {
            $h = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashLines += "$h  $($file.Name)"
            if ($file.Name -eq "HUDMind-Setup-win-x64.exe" -and (Test-Path "packaging/winget/Vgarzaniti.HUDMind.installer.yaml")) {
              $wingetYaml = Get-Content "packaging/winget/Vgarzaniti.HUDMind.installer.yaml" -Raw
              $wingetYaml = $wingetYaml -replace '(?m)^(\s*PackageVersion:\s*).*$', "`$1$env:APP_VERSION"
              $wingetYaml = $wingetYaml -replace 'releases/download/v[^/]+/', "releases/download/$env:RELEASE_TAG/"
              $wingetYaml = $wingetYaml -replace '(?m)^(\s*InstallerSha256:\s*).*$', "`$1$($h.ToUpperInvariant())"
              New-Item -ItemType Directory -Force -Path "release-assets/winget" | Out-Null
              Copy-Item "packaging/winget/Vgarzaniti.HUDMind.yaml" "release-assets/winget/" -Force
              Copy-Item "packaging/winget/Vgarzaniti.HUDMind.locale.en-US.yaml" "release-assets/winget/" -Force
              Copy-Item "packaging/winget/Vgarzaniti.HUDMind.locale.es-ES.yaml" "release-assets/winget/" -Force
              Set-Content -Path "release-assets/winget/Vgarzaniti.HUDMind.installer.yaml" -Value $wingetYaml -NoNewline
            }
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines("$PWD/release-assets/SHA256SUMS.txt", $hashLines, $utf8NoBom)
          Get-Content "release-assets/SHA256SUMS.txt"

      - name: Create GitHub Release with binaries and SHA-256 checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @'
          ### Descargas Windows 10/11 (x64)
          - **`HUDMind-Setup-win-x64.exe`** *(Recomendado)*: instalador para Windows (crea acceso directo con ícono en Menú Inicio, sin permisos de administrador ni instalar .NET 9).
          - **`HUDMind.Native-Standalone-win-x64.exe`**: ejecutable 100% portable sin instalación previa ni .NET 9 Runtime.
          - **`HUDMind.Native-win-x64.exe`**: versión liviana (~26 MB) si ya tenés instalado [.NET 9 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/9.0).
          - **`SHA256SUMS.txt`**: firmas de integridad verificadas automáticamente por el actualizador integrado de HUDMind.

          ---
          '@

          $argsList = @(
            "release", "create", $env:RELEASE_TAG,
            "release-assets/HUDMind-Setup-win-x64.exe",
            "release-assets/HUDMind.Native-Standalone-win-x64.exe",
            "release-assets/HUDMind.Native-win-x64.exe",
            "release-assets/SHA256SUMS.txt",
            "--title", "HUDMind $env:RELEASE_TAG",
            "--notes", $notes,
            "--generate-notes"
          )

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $argsList += @("--target", "${{ github.sha }}")
          }
          if ($env:IS_PRERELEASE -eq "true") {
            $argsList += "--prerelease"
          }

          gh @argsList
