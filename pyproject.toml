[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hudmind"
version = "0.4.0"
description = "HUDMind — Real-time Windows gaming coach powered by Gemini multimodal API, Context Caching, transparent click-through overlay, and async TTS."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[project.scripts]
hudmind = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 105
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501",  # line length handled softly for Spanish prompt/log strings
    "S101",  # allow assert in tests
    "S110",  # allow intentional silent cleanup in shutdown blocks
    "S311",  # non-cryptographic jitter for API backoff
    "S603",  # subprocess call with explicit arg list in PiperTTSEngine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["^\\.venv/"]
